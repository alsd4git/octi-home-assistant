[project]
name = "octi-home-assistant"
version = "0.1.0"
description = "Community Home Assistant integration for Octi"
requires-python = ">=3.13.2"
dependencies = [
  "aiohttp>=3.10,<4",
  "cryptography>=42,<51",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-homeassistant-custom-component==0.13.316",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
