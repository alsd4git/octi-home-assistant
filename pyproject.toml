[project]
name = "octi-home-assistant"
version = "0.1.0"
description = "Community Home Assistant integration for Octi"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "cryptography>=42,<51",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
