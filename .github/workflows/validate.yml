name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  tests:
    name: Quality and protocol tests
    runs-on: ubuntu-latest
    container: python:3.13
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - name: Run format, lint, unit and Home Assistant tests
        run: |
          uv sync --locked
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest -q
          uv run python scripts/verify_interop_fixtures.py

  homeassistant-matrix:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.2.3"
            python: "3.13"
            test_package: "0.13.316"
          - homeassistant: "2026.8.2"
            python: "3.14"
            test_package: "0.13.356"
    container: python:${{ matrix.python }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - name: Run Home Assistant test suite
        run: >-
          uv run --no-project
          --with pytest-homeassistant-custom-component==${{ matrix.test_package }}
          pytest -q --timeout=30
